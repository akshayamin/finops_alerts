# =============================================================================
# ALERTS DEPLOYMENT CONFIGURATION
# =============================================================================
# 
# Purpose: Deploy FinOps alerts with selective options
# 
# This configuration allows you to deploy specific categories of alerts:
# - Cost monitoring alerts
# - Usage monitoring alerts  
# - Performance monitoring alerts
# 
# You can enable/disable specific alert categories using variables
# 
# =============================================================================

bundle:
  name: finops_alerts_deployment
  version: 1.0.0
  description: "FinOps monitoring alerts deployment"

targets:
  dev:
    default: true
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog_name: "finops_dev"
      schema_name: "alerts"
      warehouse_id: ${var.dev_warehouse_id}
      alert_owner: ${var.dev_alert_owner}
      notification_email: ${var.dev_notification_email}
      
  staging:
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog_name: "finops_staging"
      schema_name: "alerts"
      warehouse_id: ${var.staging_warehouse_id}
      alert_owner: ${var.staging_alert_owner}
      notification_email: ${var.staging_notification_email}
      
  prod:
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog_name: "finops_prod"
      schema_name: "alerts"
      warehouse_id: ${var.prod_warehouse_id}
      alert_owner: ${var.prod_alert_owner}
      notification_email: ${var.prod_notification_email}

# Cost Monitoring Alerts
cost_alerts:
  enabled: ${var.enable_cost_alerts}
  alerts:
    - name: budget_threshold_alert
      path: src/finops/cost_monitoring/budget_threshold_alert.sql
      catalog: ${bundle.targets.${bundle.target}.variables.catalog_name}
      schema: ${bundle.targets.${bundle.target}.variables.schema_name}
      description: "Monitor budget thresholds and cost spikes"
      parameters:
        warehouse_id: ${bundle.targets.${bundle.target}.variables.warehouse_id}
        user_email: ${bundle.targets.${bundle.target}.variables.notification_email}
        parent_path: "/Workspace/Users/${bundle.targets.${bundle.target}.variables.alert_owner}/finops_alerts/cost_monitoring"

# Usage Monitoring Alerts
usage_alerts:
  enabled: ${var.enable_usage_alerts}
  alerts:
    - name: cluster_utilization_alert
      path: src/finops/usage_monitoring/cluster_utilization_alert.sql
      catalog: ${bundle.targets.${bundle.target}.variables.catalog_name}
      schema: ${bundle.targets.${bundle.target}.variables.schema_name}
      description: "Monitor cluster utilization and resource usage"
      parameters:
        warehouse_id: ${bundle.targets.${bundle.target}.variables.warehouse_id}
        user_email: ${bundle.targets.${bundle.target}.variables.notification_email}
        parent_path: "/Workspace/Users/${bundle.targets.${bundle.target}.variables.alert_owner}/finops_alerts/usage_monitoring"

# Performance Monitoring Alerts
performance_alerts:
  enabled: ${var.enable_performance_alerts}
  alerts:
    - name: query_performance_alert
      path: src/finops/performance/query_performance_alert.sql
      catalog: ${bundle.targets.${bundle.target}.variables.catalog_name}
      schema: ${bundle.targets.${bundle.target}.variables.schema_name}
      description: "Monitor query performance and execution patterns"
      parameters:
        warehouse_id: ${bundle.targets.${bundle.target}.variables.warehouse_id}
        user_email: ${bundle.targets.${bundle.target}.variables.notification_email}
        parent_path: "/Workspace/Users/${bundle.targets.${bundle.target}.variables.alert_owner}/finops_alerts/performance"

# Deployment options
deploy_options:
  # Selective deployment
  deploy_cost_alerts: ${var.enable_cost_alerts}
  deploy_usage_alerts: ${var.enable_usage_alerts}
  deploy_performance_alerts: ${var.enable_performance_alerts}
  
  # Customization
  custom_warehouse_id: ${var.custom_warehouse_id}
  custom_alert_owner: ${var.custom_alert_owner}
  custom_notification_email: ${var.custom_notification_email}

# Validation
validation:
  required_variables:
    - databricks_host
    - dev_warehouse_id
    - staging_warehouse_id
    - prod_warehouse_id
    - dev_alert_owner
    - staging_alert_owner
    - prod_alert_owner
    - dev_notification_email
    - staging_notification_email
    - prod_notification_email
  
  optional_variables:
    - enable_cost_alerts
    - enable_usage_alerts
    - enable_performance_alerts
    - custom_warehouse_id
    - custom_alert_owner
    - custom_notification_email 