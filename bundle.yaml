# =============================================================================
# FINOPS ALERTS BUNDLE CONFIGURATION
# =============================================================================
# 
# Purpose: Main bundle configuration for FinOps alerts deployment
# 
# =============================================================================

bundle:
  name: finops_alerts

# Target environments
targets:
  dev:
    default: true
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog_name: "finops_dev"
      schema_name: "alerts"
      warehouse_id: ${var.dev_warehouse_id}
      alert_owner: ${var.dev_alert_owner}
      notification_email: ${var.dev_notification_email}
      
  staging:
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog_name: "finops_staging"
      schema_name: "alerts"
      warehouse_id: ${var.staging_warehouse_id}
      alert_owner: ${var.staging_alert_owner}
      notification_email: ${var.staging_notification_email}
      
  prod:
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog_name: "finops_prod"
      schema_name: "alerts"
      warehouse_id: ${var.prod_warehouse_id}
      alert_owner: ${var.prod_alert_owner}
      notification_email: ${var.prod_notification_email}

# Variables
variables:
  databricks_host:
    description: "Databricks workspace host URL"
    
  dev_warehouse_id:
    description: "Development SQL warehouse ID"
    
  staging_warehouse_id:
    description: "Staging SQL warehouse ID"
    
  prod_warehouse_id:
    description: "Production SQL warehouse ID"
    
  dev_alert_owner:
    description: "Development alert owner username"
    
  staging_alert_owner:
    description: "Staging alert owner username"
    
  prod_alert_owner:
    description: "Production alert owner username"
    
  dev_notification_email:
    description: "Development notification email"
    
  staging_notification_email:
    description: "Staging notification email"
    
  prod_notification_email:
    description: "Production notification email"
    
  catalog_name:
    description: "Catalog name for functions"
    
  schema_name:
    description: "Schema name for functions"
    
  warehouse_id:
    description: "Warehouse ID for functions"
    
  alert_owner:
    description: "Alert owner username"
    
  notification_email:
    description: "Notification email"
    
  enable_cost_alerts:
    description: "Enable cost monitoring alerts"
    default: false
    
  enable_usage_alerts:
    description: "Enable usage monitoring alerts"
    default: false
    
  enable_performance_alerts:
    description: "Enable performance monitoring alerts"
    default: false 